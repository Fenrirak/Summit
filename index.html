<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <script>document.documentElement.classList.add('js-ready');</script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Summit</title>

    <link rel="icon" type="image/png" href="Summit_Icon.png">

    <meta name="description" content="Summit Party.">

    <link rel="stylesheet" href="site-nav.css">
    <link rel="stylesheet" href="summit.css">

    <style>
        .logo-hero {
            min-height: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 0 10px;
        }
        .logo-hero img {
            width: min(340px, 62vw);
            height: auto;
        }
        .logo-hero .hero-rule { margin-top: 34px; }
        .scroll-cue {
            margin-top: 8px;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--c-muted);
        }
        .tabs-section { padding: 10px 0 20vh; }
        .tabs-section h2 {
            text-align: center;
            font-size: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--c-muted);
            margin-bottom: 22px;
        }
    </style>

</head>

<body>

    <nav class="topbar" aria-label="Main">
        <div class="nav-links">
            <a href="index.html" class="active">
                <span>Home</span>
            </a>
            <a href="down-the-inflation.html">
                <span>Down the Inflation</span>
            </a>
            <a href="iron-fist.html">
                <span>Iron Fist</span>
            </a>
            <a href="coalition.html">
                <span>Coalition</span>
            </a>
        </div>
    </nav>

    <main class="container">

        <section class="logo-hero pop-group">
            <img class="pop-in" src="Summit_Icon.png" alt="Summit Party logo">
            <div class="hero-rule pop-in"></div>
            <span class="scroll-cue pop-in">Scroll</span>
        </section>

        <section class="tabs-section pop-group">
            <h2 class="pop-in">Explore</h2>
            <div class="tab-cards">
                <a class="tab-card pop-in" href="down-the-inflation.html">
                    <span class="tab-kicker">Policy</span>
                    <span class="tab-title">Down the Inflation</span>
                </a>
                <a class="tab-card pop-in" href="iron-fist.html">
                    <span class="tab-kicker">Policy</span>
                    <span class="tab-title">Iron Fist</span>
                </a>
                <a class="tab-card pop-in" href="coalition.html">
                    <span class="tab-kicker">Statement of Intent</span>
                    <span class="tab-title">Coalition Partners</span>
                </a>
            </div>
        </section>

    </main>

    <script src="site-nav.js"></script>

</body>

</html>
